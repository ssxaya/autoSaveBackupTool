appId: com.asbt.electron
productName: ASBT - 自动存档备份工具
copyright: Copyright © 2025 Yanxiao(ssxaya)

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*
  - backend/**/*

extraResources:
  - from: backend
    to: backend

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: build/icon.icns

linux:
  target:
    - target: AppImage
      arch:
        - x64
  icon: build/icon.png
