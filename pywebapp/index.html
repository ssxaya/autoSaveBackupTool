<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASBT · 自动存档备份工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "微软雅黑", "Microsoft YaHei", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .announcement-bar {
            flex: 1;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            padding-right: 10px;
            font-size: 14px;
        }

        .section {
            padding: 20px;
            border-bottom: 1px solid #e0e0e0;
        }

        .section h2 {
            font-size: 16px;
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid #667eea;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }

        .form-group input[type="text"],
        .form-group input[type="number"] {
            width: calc(100% - 120px);
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .form-group.inline {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 0;
        }

        .form-group.inline input {
            width: 80px;
        }

        .btn-group {
            display: inline-flex;
            gap: 5px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            font-family: inherit;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-success {
            background: #48bb78;
            color: white;
        }

        .btn-success:hover {
            background: #38a169;
        }

        .btn-danger {
            background: #f56565;
            color: white;
        }

        .btn-danger:hover {
            background: #e53e3e;
        }

        .btn-secondary {
            background: #718096;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6a7a;
        }

        .table-container {
            max-height: 250px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #f7fafc;
            position: sticky;
            top: 0;
        }

        th, td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            font-weight: 600;
            color: #4a5568;
        }

        tbody tr:hover {
            background: #f7fafc;
        }

        tbody tr.selected {
            background: #e6f0ff;
        }

        .footer {
            padding: 15px 20px;
            background: #f7fafc;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-bar {
            flex: 1;
            margin-left: 20px;
            padding: 8px 12px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 13px;
            color: #555;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: white;
            margin: 5% auto;
            padding: 0;
            border-radius: 12px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideDown 0.3s;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            font-size: 16px;
            margin: 0;
        }

        .close {
            color: white;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .close:hover {
            opacity: 0.7;
        }

        .modal-body {
            padding: 20px;
            max-height: 400px;
            overflow-y: auto;
        }

        .modal-footer {
            padding: 15px 20px;
            background: #f7fafc;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .list-container {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        .list-item {
            padding: 10px 12px;
            border-bottom: 1px solid #e2e8f0;
            cursor: pointer;
            transition: background 0.2s;
        }

        .list-item:last-child {
            border-bottom: none;
        }

        .list-item:hover {
            background: #f7fafc;
        }

        .list-item.selected {
            background: #e6f0ff;
        }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 15px 0;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 10px;
            padding: 10px;
        }

        .info-item {
            display: contents;
        }

        .info-item label {
            font-weight: 500;
            color: #555;
        }

        .info-item span {
            color: #333;
        }

        .log-entry {
            padding: 10px;
            border-bottom: 1px solid #e2e8f0;
            margin-bottom: 5px;
            cursor: pointer;
        }

        .log-entry:last-child {
            border-bottom: none;
        }

        .log-entry:hover {
            background: #f7fafc;
        }

        .log-entry.selected {
            background: #e6f0ff;
        }

        .announcements-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .announcement-item {
            padding: 12px;
            background: #f7fafc;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .announcement-date {
            font-size: 12px;
            color: #667eea;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .announcement-content {
            font-size: 14px;
            color: #333;
            line-height: 1.6;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #a1a1a1;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="announcement-bar" id="announcementBar">
                <span id="announcementText">加载中...</span>
            </div>
            <button class="btn btn-small" onclick="showAnnouncements()">查看公告</button>
        </header>

        <section class="section file-settings">
            <h2>存档文件设置</h2>
            <div class="form-group">
                <label>源文件/文件夹:</label>
                <input type="text" id="sourcePath" readonly placeholder="请选择文件或文件夹">
                <div class="btn-group">
                    <button class="btn btn-small" onclick="selectSource('file')">选择文件</button>
                    <button class="btn btn-small" onclick="selectSource('directory')">选择文件夹</button>
                </div>
            </div>
            <div class="form-group">
                <label>备份目录:</label>
                <input type="text" id="backupDir" readonly placeholder="请选择备份目录">
                <div class="btn-group">
                    <button class="btn btn-small" onclick="selectBackupDir()">浏览</button>
                    <button class="btn btn-small" onclick="showBackupDirsList()">历史备份目录</button>
                </div>
            </div>
        </section>

        <section class="section backup-settings">
            <h2>备份设置</h2>
            <div class="form-row">
                <div class="form-group inline">
                    <label>备份间隔(分钟):</label>
                    <input type="number" id="interval" min="1" max="1440" value="5">
                </div>
                <button class="btn btn-primary" id="backupBtn" onclick="manualBackup()">立即备份</button>
                <button class="btn btn-success" id="autoBackupBtn" onclick="toggleAutoBackup()">开始自动备份</button>
            </div>
        </section>

        <section class="section backup-list">
            <h2>备份历史</h2>
            <div class="table-container">
                <table id="backupTable">
                    <thead>
                        <tr>
                            <th width="150">时间</th>
                            <th width="450">文件名</th>
                        </tr>
                    </thead>
                    <tbody id="backupTableBody">
                    </tbody>
                </table>
            </div>
        </section>

        <footer class="footer">
            <button class="btn btn-small" onclick="showLogs()">查看日志</button>
            <div class="status-bar" id="statusBar">准备就绪</div>
        </footer>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">标题</h3>
                <span class="close" onclick="closeModal()">&times;</span>
            </div>
            <div class="modal-body" id="modalBody">
            </div>
            <div class="modal-footer" id="modalFooter">
            </div>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
